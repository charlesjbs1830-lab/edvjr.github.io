<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamiclock | Painel de Produtividade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <div class="logo-area">
                <span class="logo-text">EDV <small>SERVIÇOS JURÍDICOS</small></span>
            </div>
            <nav class="nav-links">
                <a href="#" class="active-nav">Painel Kamiclock</a>
            </nav>
        </div>
    </header>

    <main class="main-body">
        <div class="container-central">

            <!-- Tela de Login / Autenticação -->
            <section id="loginSection" class="card-institutional">
                <div class="card-header-custom">
                    <h2>Autenticação de Membro</h2>
                    <p>Informe seu e-mail corporativo para acessar o painel de registro.</p>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="emailMembro">E-mail Google Workspace</label>
                        <input type="email" id="emailMembro" required placeholder="membro@edvjr.com.br">
                    </div>
                    <p id="loginError" class="field-error hidden"></p>
                    <button type="submit" class="btn-primary-custom">Autenticar e Sincronizar</button>
                </form>
            </section>

            <!-- Painel Principal de Lançamento (Oculto até autenticação) -->
            <section id="dashboardSection" class="card-institutional hidden">
                <div class="user-top-bar">
                    <div>
                        <h2>Registro de Produtividade</h2>
                        <p id="welcomeUser" class="subtext-user">Sincronizado com: </p>
                    </div>
                    <button id="btnLogout" class="btn-secundario-custom">Desconectar</button>
                </div>

                <form id="activityForm">
                    <div class="form-group">
                        <label for="setor">Setor de Atuação</label>
                        <select id="setor" required>
                            <option value="">Selecione o setor...</option>
                            <option value="Comercial">Comercial</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Projetos">Projetos</option>
                            <option value="VPGG/Financeiro">VPGG/Financeiro</option>
                            <option value="VPGG/Gestão de Pessoas">VPGG/Gestão de Pessoas</option>
                            <option value="Diretoria/Projetos">Diretoria/Projetos</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="descricaoServico">Descrição Analítica do Serviço</label>
                        <textarea id="descricaoServico" rows="4" required placeholder="Detalhe a atividade executada..."></textarea>
                    </div>

                    <div class="form-grid-tempo">
                        <div class="form-group">
                            <label for="tempoDedicado">Tempo Dedicado</label>
                            <input type="number" id="tempoDedicado" min="1" required placeholder="Ex: 90">
                        </div>
                        <div class="form-group">
                            <label for="unidadeTempo">Unidade</label>
                            <select id="unidadeTempo" required>
                                <option value="minutos">Minutos</option>
                                <option value="horas">Horas</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="btnSalvar" class="btn-primary-custom">Registrar Atividade no Banco</button>
                </form>

                <div id="statusFeedback" class="hidden feedback-box"></div>

                <div class="historico-area">
                    <h3>Últimos registros nesta sessão</h3>
                    <ul id="listaHistorico" class="lista-historico"></ul>
                </div>
            </section>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
