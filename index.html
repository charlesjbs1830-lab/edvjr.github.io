<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamiclock Interno | EDV Jr.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Tela de Autenticação / Login Institucional -->
        <section id="loginSection" class="panel">
            <h2>Autenticação de Membro</h2>
            <p>Insira seu e-mail institucional para sincronizar os dados do Google Drive.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="emailMembro">E-mail Google Workspace:</label>
                    <input type="email" id="emailMembro" required placeholder="membro@edvjr.com.br">
                </div>
                <button type="submit">Autenticar e Sincronizar</button>
            </form>
        </section>

        <!-- Painel Principal de Lançamento (Oculto até o login) -->
        <section id="dashboardSection" class="panel hidden">
            <header class="user-header">
                <div>
                    <h2>Registro de Atividades</h2>
                    <p id="welcomeUser">Sincronizado com: </p>
                </div>
                <button id="btnLogout" class="btn-secondary">Desconectar</button>
            </header>

            <form id="activityForm">
                <div class="form-group">
                    <label for="setor">Setor de Atuação:</label>
                    <select id="setor" required>
                        <option value="">Selecione o setor...</option>
                        <option value="Comercial">Comercial</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Projetos">Projetos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descricaoServico">Descrição Analítica do Serviço:</label>
                    <textarea id="descricaoServico" rows="3" required placeholder="Detalhe a atividade executada..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="tempoDedicado">Tempo Dedicado:</label>
                        <input type="number" id="tempoDedicado" min="1" required placeholder="Ex: 90">
                    </div>
                    <div class="form-group">
                        <label for="unidadeTempo">Unidade:</label>
                        <select id="unidadeTempo" required>
                            <option value="minutos">Minutos</option>
                            <option value="horas">Horas</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="btnSalvar">Registrar Atividade no Banco</button>
            </form>

            <div id="statusFeedback" class="hidden"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
