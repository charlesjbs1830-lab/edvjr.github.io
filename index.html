<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Ociosidade | Módulo Operacional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="brand">
                <h2>EDV Jr.</h2>
                <p>LegalaaS & Analytics</p>
            </div>
            <nav>
                <a href="#" class="active">Registro de Horas</a>
                <a href="https://www.edvjr.com.br/" target="_blank">Portal Principal</a>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <h1>Painel de Capacidade Operacional</h1>
                <p>Monitoramento de entregas e cálculo de ociosidade da equipe</p>
            </header>

            <section class="card-grid">
                <div class="card form-card">
                    <h2>Lançamento de Atividade</h2>
                    <form id="timeLogForm">
                        <div class="form-group">
                            <label for="membro">Nome do Membro:</label>
                            <input type="text" id="membro" required placeholder="Nome completo">
                        </div>

                        <div class="form-group">
                            <label for="projeto">Frente / Projeto:</label>
                            <select id="projeto" required>
                                <option value="">Selecione a frente...</option>
                                <option value="Jurídico / Automação">Jurídico / Automação</option>
                                <option value="Comercial">Comercial</option>
                                <option value="Gestão Interna">Gestão Interna</option>
                                <option value="Projetos Externos">Projetos Externos</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="horasExecutadas">Horas Dedicadas:</label>
                            <input type="number" id="horasExecutadas" min="1" max="40" required placeholder="Ex: 15">
                        </div>

                        <div class="form-group">
                            <label for="horasEsperadas">Capacidade Esperada (Meta):</label>
                            <input type="number" id="horasEsperadas" min="1" max="40" required placeholder="Ex: 20">
                        </div>

                        <button type="submit" id="btnProcessar">Calcular e Registrar</button>
                    </form>
                </div>

                <div class="card metrics-card">
                    <h2>Indicadores em Tempo Real</h2>
                    <div id="resultadoMetricas" class="metrics-placeholder">
                        <p class="placeholder-text">Aguardando submissão de dados para cálculo da ociosidade...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
